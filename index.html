<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Electronics AI Engine</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!---Testing part--->
<iframe
  id="visuals-iframe"
  src="https://surudmahajan.github.io/test/"
  style="width:100%; height:300px; border:1px solid #ccc;"
></iframe>
  <button onclick="sendTestToVisuals()">Send test data</button>

<script>
function sendTestToVisuals() {
  const iframe = document.getElementById("visuals-iframe");

  if (!iframe) {
    console.error("visuals-iframe not found");
    return;
  }

  iframe.contentWindow.postMessage(
    {
      type: "ENGINE_RESULT",
      payload: {
        domain: "electronics",
        subdomain: "dc",
        operation: "nodal",
        data: {
          node_voltages: {
            V1: 5,
            V2: 2.3,
            V3: 0
          }
        }
      }
    },
    "*"
  );
}
</script>



  <div class="app">

    <div class="header">
      <h1>Electronics AI Engine</h1>
      <p>DC • AC • Machines • Digital • Logic • Combinational</p>
    </div>

    <!-- USER QUERY -->
    <textarea
      id="userInput"
      placeholder="Example: solve nodal analysis for a DC circuit"
    ></textarea>

    <button onclick="send()">Run</button>

    <!-- STATUS -->
    <div class="status" id="status"></div>

    <!-- DYNAMIC INPUT FORM -->
    <div id="form"></div>

    <!-- OUTPUT -->
    <pre id="output"></pre>

  </div>

  <script type="module">
    import { sendMessage } from "./chat.js?v=3";
    window.send = sendMessage;
  </script>
  

</body>
</html>
