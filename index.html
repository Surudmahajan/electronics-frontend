<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Electronics AI Engine</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>


  <div class="app">

    <div class="header">
      <h1>Electronics AI Engine</h1>
      <p>DC • AC • Machines • Digital • Logic • Combinational</p>
    </div>

    <!-- USER QUERY -->
    <textarea
      id="userInput"
      placeholder="Example: solve nodal analysis for a DC circuit"
    ></textarea>

    <button onclick="send()">Run</button>

    <!-- STATUS -->
    <div class="status" id="status"></div>

    <!-- DYNAMIC INPUT FORM -->
    <div id="form"></div>

    <!-- OUTPUT -->
    <pre id="output"></pre>

  </div>

  <script type="module">
    import { sendMessage } from "./chat.js?v=3";
    window.send = sendMessage;
  </script>

</body>
</html>
