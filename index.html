<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Electronics AI Engine</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="grid-overlay"></div>

  <div class="app">
    <div class="header">
      <div class="logo-icon">⚡</div>
      <h1>Electronics AI Engine</h1>
      <p>DC • AC • Machines • Digital • Logic • Combinational and more...</p>
    </div>

    <div class="input-section">
      <textarea
        id="userInput"
        placeholder="Example: solve nodal analysis for a DC circuit..."
      ></textarea>
      
      <div class="action-bar">
        <div class="status" id="status">Ready to process...</div>
        <button class="run-btn" onclick="send()">
          <span>Run Analysis</span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        </button>
      </div>
    </div>

    <div id="form"></div>

    <div class="output-container">
      <pre id="output"></pre>
    </div>

    <div class="visuals-panel" id="visuals-panel">
      <div class="visuals-toolbar">
        <div class="panel-title">
            <span class="dot"></span>
            Visuals Engine
        </div>
        <div class="visuals-actions">
          <button class="tool-btn" onclick="toggleVisuals()">Hide</button>
          <button class="tool-btn primary" onclick="fullscreenVisuals()">Fullscreen</button>
        </div>
      </div>

      <div class="iframe-wrapper">
        <iframe
          id="visuals-iframe"
          src="https://ovisual.netlify.app/"
          loading="lazy"
        ></iframe>
      </div>
    </div>
  </div>

  <script type="module">
    import { sendMessage } from "./chat.js?v=3";
    window.send = sendMessage;
  </script>
  <script>
    let visualsVisible = true;

    function toggleVisuals() {
      const panel = document.getElementById("visuals-panel");
      const btn = event.target;

      visualsVisible = !visualsVisible;
      panel.classList.toggle("hidden", !visualsVisible);

      btn.textContent = visualsVisible ? "Hide" : "Show";
    }

    function fullscreenVisuals() {
      const panel = document.getElementById("visuals-panel");
      panel.classList.toggle("fullscreen");
      panel.classList.remove("hidden");
    }
  </script>
  <!-- Floating Button -->
<div id="omniaiToggle"
     style="
       position: fixed;
       bottom: 20px;
       right: 20px;
       width: 60px;
       height: 60px;
       border-radius: 50%;
       background: linear-gradient(135deg,#2563eb,#1d4ed8);
       color: white;
       display: flex;
       align-items: center;
       justify-content: center;
       font-size: 26px;
       cursor: pointer;
       box-shadow: 0 10px 30px rgba(0,0,0,0.4);
       z-index: 10000;">
⚡
</div>

<!-- Chat Container -->
<div id="omniaiContainer"
     style="
       position: fixed;
       bottom: 90px;
       right: 20px;
       width: 380px;
       height: 520px;
       display: none;
       z-index: 9999;
       border-radius: 16px;
       overflow: hidden;
       box-shadow: 0 15px 50px rgba(0,0,0,0.5);
     ">

  <iframe
    id="omniaiFrame"
    data-loaded="false"
    src="https://surudmahajan.github.io/omniai/"
    style="
      width:100%;
      height:100%;
      border:none;
    ">
  </iframe>

</div>

<script>
const toggleBtn = document.getElementById("omniaiToggle");
const container = document.getElementById("omniaiContainer");

toggleBtn.onclick = () => {

  if (container.style.display === "none") {
      container.style.display = "block";
  } else {
      container.style.display = "none";
  }

};
</script>

</body>
</html>
