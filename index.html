<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Electronics AI Engine</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="app">
  <div class="header">
    ⚡ Electronics AI Engine
  </div>

</div>

<script src="chat.js"></script>
</body>
</html>
